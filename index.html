<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бухгалтер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root[data-theme="light"]{
  --solid:#ffffff; --bg:#f3f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e4e9f1;
  --zl:#dc2626; --usd:#059669; --blue:#2563eb; --amber:#f59e0b;
  --chip:#eef2f8; --on:#1e293b; --onT:#ffffff; --field:#f4f6fa;
  --good:#dcfce7; --goodT:#166534; --bad:#fee2e2; --badT:#991b1b;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);
}
:root,:root[data-theme="dark"]{
  --solid:#0d1530; --bg:#070b1a; --card:rgba(21,30,56,.72); --ink:#e8edf6; --mute:#8b98b3; --line:rgba(255,255,255,.08);
  --zl:#f87171; --usd:#34d399; --blue:#60a5fa; --amber:#fbbf24;
  --chip:#1c2740; --on:#fbbf24; --onT:#1b1403; --field:#0f1830;
  --good:#12361f; --goodT:#86efac; --bad:#3b1518; --badT:#fca5a5; --shadow:none;
}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 38% at 12% -4%,rgba(99,102,241,.42),transparent 70%),radial-gradient(55% 34% at 100% 22%,rgba(236,72,153,.2),transparent 70%),radial-gradient(70% 40% at 50% 104%,rgba(20,184,166,.22),transparent 70%)}
:root[data-theme="light"] body::before{background:radial-gradient(70% 38% at 12% -4%,rgba(99,102,241,.14),transparent 70%),radial-gradient(55% 34% at 100% 30%,rgba(236,72,153,.08),transparent 70%)}
:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .stat,:root:not([data-theme="light"]) .chip{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .stat{border:1px solid rgba(255,255,255,.08)}
:root:not([data-theme="light"]) .chip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
:root:not([data-theme="light"]) .save,:root:not([data-theme="light"]) .addbtn,:root:not([data-theme="light"]) .pvrow button,:root:not([data-theme="light"]) .sheet .acts .sv{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#f97316);color:#1b1403}
:root:not([data-theme="light"]) .pill.on,:root:not([data-theme="light"]) .seg button.on{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1b1403}
:root:not([data-theme="light"]) .seg{background:rgba(255,255,255,.06)}
.themebtn{display:block;margin:22px auto 0;padding:9px 16px;border-radius:99px;background:var(--chip);color:var(--mute);font-size:13px;font-weight:600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:14px 14px 170px}
.tab[hidden]{display:none}
h3{margin:18px 4px 8px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.02em}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}

/* вибір типу */
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--chip);padding:5px;border-radius:16px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border-radius:12px;font-size:10px;font-weight:600;color:var(--mute)}
.seg button span{font-size:19px;line-height:1}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* сума */
.amtrow{display:flex;align-items:baseline;gap:8px;margin:2px 2px 10px}
#amt{flex:1;min-width:0;border:0;background:none;outline:none;font-size:46px;font-weight:700;letter-spacing:-.02em;padding:0}
#amt::placeholder{color:var(--line)}
#cur{font-size:22px;font-weight:700;color:var(--mute)}
.txt{width:100%;border:0;outline:none;background:var(--field);border-radius:12px;padding:12px 14px;font-size:16px;margin-top:8px}
.monthrow{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.monthrow small{color:var(--mute);font-size:12px;margin-right:2px}
.pill{padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:var(--mute)}
.pill.on{background:var(--on);color:var(--onT)}
select.pill{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:13px;font-weight:600;max-width:100%;cursor:pointer}

/* кнопки-підказки */
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{position:relative;display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;min-width:0;border:2px solid transparent}
.chip.on{border-color:var(--amber)}
.chip .e{font-size:22px;flex:none}
.chip .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:650;font-size:14px;line-height:1.2;overflow:hidden;word-break:break-word}
.chip .a{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.chip .w{min-width:0}
.hint{color:var(--mute);font-size:13px;padding:2px 6px}

/* кнопка Записати */
.savebar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));padding:10px 14px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.save{display:block;width:100%;max-width:492px;margin:0 auto;padding:15px;border-radius:16px;background:var(--on);color:var(--onT);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.save:disabled{opacity:.35}

/* нижнє меню */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--solid);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:12px}
nav button span{font-size:21px;line-height:1.1}
nav button.on{color:var(--ink)}
nav button.on span{transform:scale(1.12)}

/* повідомлення */
#toast{position:fixed;left:14px;right:14px;bottom:calc(135px + env(safe-area-inset-bottom));max-width:492px;margin:0 auto;background:#0f172a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px}
#toast[hidden]{display:none}
#toast.err{background:#991b1b}
#toast .m{flex:1}
#toast button{color:#fbbf24;font-weight:700;padding:4px 6px}

/* місяць / рік */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:22px;line-height:1}
.nav .ttl{font-size:18px;font-weight:700}
.hero{padding:18px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff}
.hero .l{font-size:13px;opacity:.7}
.hero .v{font-size:38px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.hero .v small{font-size:20px;opacity:.7;font-weight:600}
.hero .s{font-size:13px;opacity:.7;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.stat .l{font-size:11px;color:var(--mute);font-weight:600}
.stat .v{font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap}
.stat.good{background:var(--good);color:var(--goodT)} .stat.good .l{color:var(--goodT)}
.stat.bad{background:var(--bad);color:var(--badT)} .stat.bad .l{color:var(--badT)}
.zl{color:var(--zl)} .usd{color:var(--usd)}
.bar{margin:9px 0}
.bar .r{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px;gap:8px}
.bar .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.list .it{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.list .it:last-child{border:0}
.list .n{width:22px;color:var(--mute);font-size:12px;text-align:right;flex:none}
.list .d{flex:1;min-width:0;font-weight:550}
.list .a{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .c i{display:block;width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#f59e0b,#ef4444);min-height:3px}
.chart .c b{font-size:9px;color:var(--mute);margin-bottom:3px;font-weight:600;white-space:nowrap}
.chart .c em{font-style:normal;font-size:10px;color:var(--mute);margin-top:5px}
.mrow{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);gap:8px}
.mrow:last-child{border:0}
.mrow .x{font-size:12px;color:var(--mute);margin-top:2px}
.mrow .r{text-align:right;font-weight:700}
.load{text-align:center;color:var(--mute);padding:40px 0}
.trend{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.trend.up{color:#fca5a5}.trend.down{color:#86efac}
.bar .r .em,.list .em{margin-right:6px}
.list .em{font-size:17px;flex:none;width:24px;text-align:center}
.who{display:flex;align-items:center;gap:12px}
.ava{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.debt{margin-bottom:10px}
.debt .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.debt .nm{font-weight:700;font-size:16px}
.debt .sm{font-size:12px;color:var(--mute);margin-top:2px}
.debt .big{font-size:22px;font-weight:800;color:var(--blue);white-space:nowrap;text-align:right}
.debt .hs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--mute)}
.debt .hs div{display:flex;justify-content:space-between;padding:2px 0}
.minibtn{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px}
.hero.blue{background:linear-gradient(135deg,#1d4ed8,#312e81)}
.addbtn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--on);color:var(--onT);font-weight:700;font-size:16px;margin-top:10px}
.sub2{display:flex;gap:8px;margin:0 0 6px}
.sub2 .pill{flex:1;text-align:center;padding:9px 12px;font-size:14px}
nav button span{font-size:20px}
.descrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.descrow .txt{margin-top:0;flex:1;min-width:0}
.emo{flex:none;width:46px;height:46px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:24px}
.h3row{display:flex;justify-content:space-between;align-items:flex-end}
.edit{font-size:13px;font-weight:700;color:var(--blue);padding:4px 6px;margin-top:14px}
.pinlink{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px;color:var(--ink)}
.hero.green{background:linear-gradient(135deg,#047857,#0f766e 55%,#134e4a)}
.pl{margin-top:10px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl.good{background:var(--good);color:var(--goodT)}.pl.bad{background:var(--bad);color:var(--badT)}
.pl .big{font-size:24px;font-weight:800}.pl small{display:block;font-size:12px;opacity:.8;margin-top:2px}
.pvrow{display:flex;gap:8px;margin-top:8px}.pvrow .txt{margin-top:0;flex:1}
.pvrow button{padding:0 16px;border-radius:12px;background:var(--on);color:var(--onT);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}.kv span:first-child{color:var(--mute)}.kv b{font-weight:700}
.chart.g .c i{background:linear-gradient(180deg,#34d399,#059669)}
.bar .tr.g i{background:linear-gradient(90deg,#34d399,#059669)}
.ratehint{font-size:12.5px;color:var(--mute);padding:8px 2px 0}
.hero.gold{background:linear-gradient(135deg,#1e1b4b,#4c1d95 55%,#7c2d12)}
.cur3{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cur3 span{background:rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;font-weight:700;font-size:15px}
.wl{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.wl:last-child{border:0}
.wl .we{width:42px;height:42px;border-radius:13px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.wl .wn{flex:1;min-width:0}.wl .wn b{display:block;font-size:15px}.wl .wn small{color:var(--mute);font-size:12px}
.wl .wv{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}.wl .wv small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.wl.neg .wv{color:var(--zl)}
.badge{font-size:10px;font-weight:700;background:var(--chip);color:var(--mute);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--solid);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet .sh-h{font-size:18px;font-weight:800;margin-bottom:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.presets .pill{font-size:13px}
.curpills{display:flex;gap:6px}.curpills .pill{padding:11px 14px;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 2px 4px;font-size:14px;color:var(--mute)}
.chk input{width:20px;height:20px}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.sheet .acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px}
.sheet .acts .sv{background:var(--on);color:var(--onT)}.sheet .acts .dl{background:var(--bad);color:var(--badT);flex:.6}
nav button{font-size:10px}
.chip.ed::after{content:'✕';position:absolute;top:-7px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--zl);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<main>

<section id="tabAdd" class="tab">
  <div class="seg" id="kinds"></div>
  <div class="card" style="margin-top:12px">
    <div class="ratehint" id="amtLbl" hidden style="margin:0 2px 2px">💰 Основна зарплата</div>
    <div class="amtrow"><input id="amt" inputmode="decimal" placeholder="0" autocomplete="off"><span id="cur">zł</span></div>
    <div class="sub2" id="loanRow" hidden><button class="pill on" data-lm="loan">🤝 Позичив</button><button class="pill" data-lm="back">✅ Повернули</button></div>
    <div class="descrow" id="descRow"><span class="emo" id="emo">🧾</span><input id="desc" class="txt" placeholder="За що? Напр. їда" maxlength="80" autocomplete="off"></div>
    <div class="descrow" id="houseRow" hidden><span class="emo">🏠</span><input id="houseIn" class="txt" inputmode="decimal" placeholder="Квартира, zł" autocomplete="off"></div>
    <div class="descrow" id="bonusRow" hidden><span class="emo">🎁</span><input id="bonusIn" class="txt" inputmode="decimal" placeholder="Премія, zł (якщо є)" autocomplete="off"></div>
    <input id="usdIn" class="txt" inputmode="decimal" placeholder="Скільки $ отримав?" autocomplete="off" hidden>
    <div class="ratehint" id="rateLine" hidden></div>
    <input id="zlIn" class="txt" inputmode="decimal" placeholder="Скільки отримав у zł? (необов'язково)" autocomplete="off" hidden>
    <div class="monthrow" id="monthRow"><small>Місяць:</small><button class="pill" id="mCur"></button><button class="pill" id="mPrev"></button><select class="pill" id="mSel"></select></div>
  </div>
  <div id="chipsWrap">
    <div id="subsBox"><div class="h3row"><h3>📌 МОЇ КНОПКИ</h3><button class="edit" id="editPins">Змінити</button></div><div class="chips" id="subs"></div><button class="pinlink" id="pinNow" hidden>📌 Закріпити як кнопку</button></div>
    <div id="commonBox"><h3>⭐ ЧАСТІ ПОКУПКИ</h3><div class="chips" id="common"></div></div>
  </div>
  <div id="invChipsBox" hidden><h3>🎯 КУДИ</h3><div class="chips" id="invChips"></div></div>
  <div id="debtChipsBox" hidden><h3>👤 ХТО ВИНЕН</h3><div class="chips" id="debtChips"></div></div>
  <h3 id="miniH">ЦЕЙ МІСЯЦЬ</h3>
  <div class="card" id="mini"><div class="load">Завантажую…</div></div>
</section>

<section id="tabMonth" class="tab" hidden>
  <div class="nav"><button id="moPrev">‹</button><div class="ttl" id="moTitle"></div><button id="moNext">›</button></div>
  <div id="moBody"><div class="load">Завантажую…</div></div>
</section>

<section id="tabDebts" class="tab" hidden>
  <div id="dBody"><div class="load">Завантажую…</div></div>
</section>

<section id="tabInv" class="tab" hidden>
  <div id="iBody"><div class="load">Завантажую…</div></div>
</section>

<section id="tabWealth" class="tab" hidden>
  <div id="wBody"><div class="load">Завантажую…</div></div>
</section>

<section id="tabYear" class="tab" hidden>
  <div class="nav"><button id="yPrev">‹</button><div class="ttl" id="yTitle"></div><button id="yNext">›</button></div>
  <div id="yBody"><div class="load">Завантажую…</div></div>
</section>

<button class="themebtn" id="themeBtn">☀️ Світла тема</button>
</main>

<div class="savebar" id="savebar"><button class="save" id="save" disabled>Записати</button></div>
<div id="toast" hidden><span class="m" id="toastMsg"></span><button id="toastBtn" hidden>Скасувати</button></div>

<nav>
  <button data-tab="Add" class="on"><span>➕</span>Додати</button>
  <button data-tab="Month"><span>📅</span>Місяць</button>
  <button data-tab="Year"><span>📊</span>Рік</button>
  <button data-tab="Debts"><span>🤝</span>Борги</button>
  <button data-tab="Inv"><span>📈</span>Інвест</button>
  <button data-tab="Wealth"><span>💎</span>Баланс</button>
</nav>

<div id="sheetBg" hidden><div class="sheet">
  <div class="sh-h" id="shT">Новий актив</div>
  <div class="presets" id="presets"></div>
  <input id="aName" class="txt" placeholder="Назва: Машина, Картка, Готівка…" maxlength="40" autocomplete="off">
  <div class="descrow"><input id="aAmt" class="txt" inputmode="decimal" placeholder="Скільки" autocomplete="off"><div class="curpills" id="curPills"></div></div>
  <label class="chk" id="negRow"><input type="checkbox" id="aNeg"> Це мій борг або кредит (віднімається)</label>
  <div class="acts"><button class="dl" id="aDel">Видалити</button><button class="sv" id="aSave">Зберегти</button></div>
</div></div>

<script>
(function () {
  var KEY = '__KEY__';
  var API_URL = 'https://script.google.com/macros/s/AKfycbyqWBML3-vfkw9GWvj-N36JNPzYsV1ESaJ8r6EpuK0byNpVodU_h0TpkeX_fV1TNCxd/exec';
  if (KEY.indexOf('__KE') === 0) {            // сторінка відкрита з GitHub: ключ беремо з посилання
    KEY = '';
    try { KEY = new URLSearchParams(location.search).get('k') || localStorage.getItem('k') || ''; if (KEY) localStorage.setItem('k', KEY); } catch (e) {}
  }
  var tg = null;
  try {
    tg = window.Telegram && window.Telegram.WebApp;

  /* ---------- вкладка «Баланс» ---------- */
  var CURS = { zl: 'zł', usd: '$', uah: '₴' };

  function renderWealth(w) {
    var h = '<div class="card hero gold"><div class="l">Мій капітал</div><div class="v">' + fmt(Math.round(w.zl)) + ' <small>zł</small></div><div class="cur3"><span>' + fmt(Math.round(w.usd)) + ' $</span><span>' + fmt(Math.round(w.uah)) + ' ₴</span></div>';

    h += '</div><div class="hint" style="margin-top:8px">💱 1 $ = ' + rt(w.rate) + ' zł · 1 ₴ = ' + (Math.round(w.uahRate * 10000) / 10000).toString().replace('.', ',') + ' zł (курс NBP)</div>';

    } else {
      h += '<h3>З ЧОГО СКЛАДАЄТЬСЯ</h3><div class="card">';
      w.lines.forEach(function (l, i) {
        var own = l.cur === 'zl' ? '' : fmt(l.neg ? -l.amount : l.amount) + ' ' + CURS[l.cur] + (l.cur === 'usd' ? '' : ' · ');
        h += '<button class="wl' + (l.neg ? ' neg' : '') + '" data-wi="' + i + '"><span class="we">' + esc(l.emoji) + '</span><span class="wn"><b>' + esc(stripEmo(l.name)) + (l.auto ? '<span class="badge">авто</span>' : '') + '</b><small>' + (l.neg ? 'борг · ' : '') + own + (l.cur === 'usd' ? '' : '≈ ' + fmt(Math.round(l.usd)) + ' $') + '</small></span><span class="wv">' + fmt(Math.round(l.zl)) + ' zł<small>' + fmt(l.uah) + ' ₴</small></span></button>';
      });
      h += '</div><div class="hint" style="margin-top:8px">🪙 «Крипта» і 🤝 «Мені винні» беруться самі з вкладок «Інвест» і «Борги».</div>';
    }
    if (w.hist.length > 1) {
      var max = Math.max.apply(null, w.hist.map(function (m) { return Math.max(m.zl, 0); }).concat([1]));
      h += '<h3>ДИНАМІКА КАПІТАЛУ</h3><div class="card"><div class="chart g">';
      w.hist.forEach(function (m) { h += '<div class="c"><b>' + (m.zl >= 1000 ? Math.round(m.zl / 1000) + 'k' : fmt(m.zl)) + '</b><i style="height:' + Math.max(2, Math.round(Math.max(m.zl, 0) / max * 100)) + '%"></i><em>' + esc(m.name.slice(0, 3)) + '</em></div>'; });
      h += '</div></div>';

  function loadWealth() {
    $('wBody').innerHTML = '<div class="load">Завантажую…</div>';
    api('appWealth').then(renderWealth).catch(function (e) { $('wBody').innerHTML = '<div class="empty">Не вдалося завантажити: ' + esc(e && e.message ? e.message : e) + '</div>'; });

  function curPillsRender() {
    $('curPills').innerHTML = ['zl', 'usd', 'uah'].map(function (c) { return '<button class="pill' + (AS.cur === c ? ' on' : '') + '" data-cur="' + c + '">' + CURS[c] + '</button>'; }).join('');
  }
  function openSheet(l) {
    AS = { id: l && !l.auto ? l.id : '', cur: l ? l.cur : 'zl', auto: l ? l.auto : '' };
    $('shT').textContent = l ? (AS.auto === 'crypto' ? 'Крипта на біржі' : 'Змінити актив') : 'Новий актив';
    $('presets').innerHTML = l ? '' : PRESETS.map(function (p, i) { return '<button class="pill" data-pre="' + i + '">' + p[0] + '</button>'; }).join('');
    $('aName').value = l ? stripEmo(l.name) : ''; $('aName').disabled = !!AS.auto;
    $('aAmt').value = l ? String(l.amount).replace('.', ',') : '';

    $('aDel').hidden = !l || AS.auto === 'debts';
    $('aDel').textContent = AS.auto === 'crypto' ? 'Прибрати' : 'Видалити';

  function saveAsset() {

      .catch(function (e) { btn.disabled = false; toast('Не вийшло: ' + (e && e.message ? e.message : e), null, true); haptic('err'); });
  }
  function delAsset() {
    var p = AS.auto === 'crypto' ? api('appSetValue', '') : api('appAssetDelete', AS.id);

  /* ---------- вкладки ---------- */
  function showTab(t) {
    ['Add', 'Month', 'Year', 'Debts', 'Inv', 'Wealth'].forEach(function (n) { $('tab' + n).hidden = n !== t; });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.className = b.getAttribute('data-tab') === t ? 'on' : ''; });
    $('savebar').hidden = t !== 'Add';
    if (t === 'Month') loadMonth();
    if (t === 'Year') loadYear();
    if (t === 'Debts') loadDebts();
    if (t === 'Inv') loadInvest();
    if (t === 'Wealth') loadWealth();
    window.scrollTo(0, 0);
  }

  /* ---------- події ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.parentNode === $('kinds')) return setKind(b.getAttribute('data-k'));
    if (b.hasAttribute('data-lm')) { S.loanMode = b.getAttribute('data-lm'); return renderForm(); }
    if (b.id === 'newLoan') { S.loanMode = 'loan'; setKind('loan'); return showTab('Add'); }
    if (b.hasAttribute('data-back')) { var pp = S.init.debts.people[+b.getAttribute('data-back')]; S.loanMode = 'back'; setKind('loan'); showTab('Add'); $('desc').value = pp.name; $('amt').value = String(pp.owed).replace('.', ','); updateSave(); return; }
    if (b.classList.contains('chip') && b.getAttribute('data-g') === 'debt') return pickDebt(+b.getAttribute('data-i'));
    if (b.classList.contains('chip')) return pick(b.getAttribute('data-g'), +b.getAttribute('data-i'));
    if (b.id === 'mCur') { S.which = 'cur'; return renderForm(); }
    if (b.id === 'mPrev') { S.which = 'prev'; return renderForm(); }
    if (b.id === 'save') return save();
    if (b.id === 'themeBtn') { THEME = THEME === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', THEME); } catch (e) {} return applyTheme(); }
    if (b.id === 'newAsset') return openSheet(null);
    if (b.hasAttribute('data-wi')) { var wl = S.wealth.lines[+b.getAttribute('data-wi')]; if (wl.auto === 'debts') return showTab('Debts'); return openSheet(wl); }
    if (b.hasAttribute('data-pre')) { var pr = PRESETS[+b.getAttribute('data-pre')]; $('aName').value = pr[1]; AS.cur = pr[2]; curPillsRender(); return $('aAmt').focus(); }
    if (b.hasAttribute('data-cur')) { AS.cur = b.getAttribute('data-cur'); return curPillsRender(); }
    if (b.id === 'aSave') return saveAsset();
    if (b.id === 'aDel') return delAsset();
    if (b.classList.contains('chip') && b.getAttribute('data-g') === 'inv') { $('desc').value = b.getAttribute('data-n'); updateSave(); return; }
    if (b.id === 'newInv') { setKind('inv'); return showTab('Add'); }
    if (b.id === 'pvSave') return savePv();
    if (b.id === 'pinNow') return pinNow();
    if (b.id === 'editPins') { S.edit = !S.edit; return renderChips(); }
    if (b.id === 'toastBtn') return undo();
    if (b.hasAttribute('data-tab')) return showTab(b.getAttribute('data-tab'));
    if (b.id === 'moPrev') { S.mo = ymShift(S.mo, -1); return loadMonth(); }
    if (b.id === 'moNext') { S.mo = ymShift(S.mo, 1); return loadMonth(); }
    if (b.id === 'yPrev') { S.yr = String(+S.yr - 1); return loadYear(); }
    if (b.id === 'yNext') { S.yr = String(+S.yr + 1); return loadYear(); }
  });
  document.addEventListener('click', function (e) {
    var r = e.target.closest('.mrow'); if (!r) return;
    S.mo = r.getAttribute('data-ym'); showTab('Month');
  });
  ['houseIn', 'bonusIn'].forEach(function (id) { $(id).addEventListener('input', function () { this.value = this.value.replace(/[^0-9.,]/g, ''); updateSave(); }); });
  $('usdIn').addEventListener('input', function () { this.value = this.value.replace(/[^0-9.,]/g, ''); updateSave(); });
  $('mSel').addEventListener('change', function () { if (this.value) { S.which = 'custom'; S.customYm = this.value; } renderForm(); });
  $('sheetBg').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  $('aAmt').addEventListener('input', function () { this.value = this.value.replace(/[^0-9.,]/g, ''); });
  $('amt').addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9.,]/g, ''); updateSave();
  });
  $('desc').addEventListener('input', function () { if (S.picked) { S.picked = null; renderChips(); } updateSave(); });

  /* ---------- старт ---------- */
  applyTheme(); renderKinds();
  api('appInit').then(function (d) {
    S.init = d; RULES = null; S.mo = d.ym; S.yr = d.ym.slice(0, 4);
    renderForm(); renderChips(); renderMini(d.month);
  }).catch(function (e) {
    $('mini').innerHTML = '<div class="empty">Не вдалося відкрити: ' + esc(e && e.message ? e.message : e) + '</div>';
  });
})();
</script>
</body>
</html>
